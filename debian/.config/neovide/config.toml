# Neovide 窗口：80列 × 30行
# grid = "135x54"
grid = "115x54"
# grid = "80x30"
chdir = "/home/ni/ni"

# 不记住上一次窗口大小
# 这样每次启动都按照上面的 grid 来
# 注意：这个选项实际上对应 Neovide 的窗口记忆行为
# 如果你的版本不接受这里的配置，可以放到 init.lua

# 字体
[font]
size = 10.0

[[font.normal]]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[[font.bold]]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[[font.italic]]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[[font.bold_italic]]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"
